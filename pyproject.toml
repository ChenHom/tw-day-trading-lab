[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-day-trading-lab"
version = "0.1.0"
description = "Taiwan stock day-trading research and replay MVP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tw-daytrade = "tw_day_trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
